# Meridian Labs demo evaluation set
#
# Ground truth for the synthetic corpus produced by build_corpus.py.
# Run `python eval.py verify` after any corpus change - it checks that every
# expect_sources file exists and that every must_include token really appears
# in it, so the eval set cannot silently drift away from the documents.
# 这是由 build_corpus.py 生成的合成语料库的“真值”（ground truth）。
# 每次修改语料库后，请运行 `python eval.py verify`；该命令会检查
# 每个 expect_sources 文件是否存在，并确认其中确实包含了所有
# must_include 标记，从而确保评估集不会在无意间与源文档脱节。

# Fields
#   id              stable identifier, used in reports
#   category        factual | reference_lookup | multi_hop | cross_lingual |
#                   acronym | unanswerable
#   lang            language of the question (fr / en)
#   question        the question sent to /api/v1/qa
#   expect_sources  document references that must be retrieved (empty = none)
#   must_include    short high-signal tokens expected in a correct answer
#   expect_answer   reference answer shown to the LLM judge
#   expect_refusal  true when the system should decline to answer

meta:
  name: meridian-demo-v1
  version: 1.1.0
  corpus: corpus/md
  notes: >
    65 questions over 25 synthetic quality-management documents.
    Six of them are deliberately unanswerable and measure refusal
    rather than recall.
  revision_notes:
    - >
      1.1.0: narrowed q29 and q56 reference answers to the facts their
      questions ask for, removing grading-only details that caused unstable
      judge verdicts for identical system answers.

questions:
  # ---------------------------------------------------------------- factual
  - id: q01
    category: factual
    lang: fr
    question: Quel est le delai de cloture d'un plan d'action pour une non-conformite majeure ?
    expect_sources: [PR-QA-MRD-009]
    must_include: ["45 jours"]
    expect_answer: 45 jours calendaires, avec validation du Responsable AQ et de la Direction.

  - id: q02
    category: factual
    lang: fr
    question: Sous quel delai le client doit-il etre informe en cas de non-conformite majeure ?
    expect_sources: [PR-QA-MRD-009]
    must_include: ["24 heures"]
    expect_answer: Dans un delai maximum de 24 heures apres la classification de la non-conformite.

  - id: q03
