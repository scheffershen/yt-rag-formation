    lang: fr
    question: Une demande d'information medicale decrivant un effet indesirable - quel circuit suit-elle et sous quel delai ?
    expect_sources: [PR-MI-MRD-001, PR-PV-MRD-002]
    must_include: ["pharmacovigilance", "15 jours"]
    expect_answer: >
      Elle est transmise sans delai au service de pharmacovigilance (PR-MI-MRD-001) puis
      traitee selon PR-PV-MRD-002 : accuse de reception sous 2 jours ouvres et transmission
      a l'autorite sous 15 jours calendaires si le cas est grave.

