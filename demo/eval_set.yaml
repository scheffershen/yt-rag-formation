    lang: fr
    question: Quels sont les indicateurs de performance du processus d'information medicale ?
    expect_sources: [PR-MI-MRD-001]
    must_include: ["95", "8 heures"]
    expect_answer: >
      Taux de reponse sous 24 heures superieur ou egal a 95 pour cent, delai moyen de reponse
      inferieur ou egal a 8 heures, taux de reclamation inferieur a 2 pour cent, tracabilite
      100 pour cent, satisfaction superieure ou egale a 4,2 sur 5.

